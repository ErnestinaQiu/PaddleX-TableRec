Global:
  model: RT-DETR-L_wireless_table_cell_det
  mode: check_dataset # check_dataset/train/evaluate/predict
  dataset_dir: "./datasets/table-rec-v2-pipe_practical_datasets_wireless"
  device: gpu:0
  output: "output"

CheckDataset:
  convert:
    enable: False
    src_dataset_type: null
  split:
    enable: False
    train_percent: null
    val_percent: null

Train:
  num_classes: 1
  epochs_iters: 40
  batch_size: 8
  learning_rate: 0.0001
  pretrain_weight_path: "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_pretrained_model/RT-DETR-L_wireless_table_cell_det_pretrained.pdparams"
  warmup_steps: 100
  resume_path: null
  log_interval: 10
  eval_interval: 1

Evaluate:
  weight_path: "output/table_cell_detection/RT-DETR-L_wireless/RT-DETR-L_wireless_table_cell_det_pretrained.pdparams"
  log_interval: 10

Export:
  weight_path: "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_pretrained_model/RT-DETR-L_wireless_table_cell_det_pretrained.pdparams"

Predict:
  batch_size: 1
  model_dir: "output/best_model/inference"
  input: "https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/table_recognition.jpg"
  kernel_option:
    run_mode: paddle
